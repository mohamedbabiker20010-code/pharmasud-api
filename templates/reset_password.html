<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعادة تعيين كلمة المرور — PharmaSUD</title><style>body{font-family:sans-serif;background:#f5f8fb;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:16px;width:min(420px,90vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px}button{background:#168bd2;color:white;border:0;border-radius:8px}</style>
<div class="card"><h2>إعادة تعيين كلمة المرور</h2><form id="reset"><input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="كلمة المرور الجديدة"><input id="confirm" type="password" autocomplete="new-password" minlength="12" required placeholder="تأكيد كلمة المرور"><button>حفظ كلمة المرور</button></form><p id="message"></p></div>
<script>const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';document.getElementById('reset').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm_password=document.getElementById('confirm').value;const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password,confirm_password})});const d=await r.json();document.getElementById('message').textContent=d.message||d.detail;});</script></html>
