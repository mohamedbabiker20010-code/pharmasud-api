<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة عملاء Daryonix — PharmaSUD</title><style>
:root{--navy:#10253f;--blue:#147dbe;--surface:#fff;--page:#f3f6f9;--line:#dce4eb;--text:#172433;--muted:#657483;--green:#147d50;--amber:#9a6200;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}.shell{max-width:1240px;margin:auto;padding:28px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.brand h1{font-size:clamp(1.55rem,3vw,2.15rem);margin:0;color:var(--navy)}.brand p{margin:5px 0 0;color:var(--muted)}.operator{font-size:.88rem;color:var(--muted);background:#e7edf3;border-radius:999px;padding:7px 12px;direction:ltr;unicode-bidi:plaintext}.primary,.action{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700}.action.secondary{background:#eef5fa;color:#0e659b;border:1px solid #b9d5e7}.action.danger{background:#fff2f0;color:var(--red);border:1px solid #f3b7b0}.action.small{padding:7px 10px;font-size:.84rem}.summaries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.summary span{display:block;color:var(--muted);font-size:.9rem}.summary strong{display:block;font-size:1.7rem;margin-top:4px;color:var(--navy)}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:230px}.search input,.toolbar select{width:100%;border:1px solid #bac7d2;border-radius:9px;padding:10px 12px;background:#fff}.toolbar select{width:auto;min-width:190px}.feedback{display:none;padding:11px 14px;border-radius:9px;margin-bottom:16px}.feedback.show{display:block}.feedback.success{background:#e8f7ef;color:#0d6840}.feedback.error{background:#fff0ef;color:#9f2319}.customer-list{display:grid;gap:14px}.customer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.customer.archived{background:#f7f8f9;color:#68737d}.customer-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.customer h2{font-size:1.08rem;margin:0 0 3px}.owner-name{color:var(--muted);font-size:.92rem}.badges{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.badge{border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:700;background:#edf2f5}.badge.green{background:#e5f6ed;color:var(--green)}.badge.amber{background:#fff5d9;color:var(--amber)}.badge.red{background:#ffebe9;color:var(--red)}.badge.gray{background:#e8ebed;color:#68737d}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.detail{min-width:0}.detail label{display:block;color:var(--muted);font-size:.76rem}.detail span{display:block;overflow-wrap:anywhere}.ltr{direction:ltr;unicode-bidi:plaintext;text-align:right}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}.empty{text-align:center;color:var(--muted);padding:38px 15px;background:#fff;border:1px dashed #bfcbd5;border-radius:14px}dialog{border:0;border-radius:16px;padding:0;width:min(620px,calc(100vw - 28px));box-shadow:0 24px 60px #07172955}dialog::backdrop{background:#07172999}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:1.2rem}.close{border:0;background:transparent;font-size:1.6rem;color:var(--muted)}form{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%;border:1px solid #b9c5cf;border-radius:9px;padding:11px}.required{color:var(--red)}.form-actions{display:flex;gap:9px;margin-top:20px}.note{color:var(--muted);font-size:.82rem;margin:10px 0 0}
@media(max-width:800px){.shell{padding:18px}.summaries{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}.topbar{flex-direction:column}.operator{max-width:100%;overflow-wrap:anywhere}}@media(max-width:480px){.shell{padding:12px}.summaries{gap:9px}.summary{padding:13px}.summary strong{font-size:1.4rem}.toolbar{align-items:stretch}.search,.toolbar select,.primary{width:100%;min-width:0}.customer{padding:14px}.customer-head{display:block}.badges{justify-content:flex-start;margin-top:10px}.details,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions .action{flex:1 1 100%}.operator{font-size:.78rem}}
</style></head><body><main class="shell"><header class="topbar"><div class="brand"><h1>إدارة عملاء Daryonix</h1><p>إدارة اشتراكات وتسليم نظام PharmaSUD</p></div><span class="operator">{{ operator }}</span></header>
<section class="summaries" aria-label="ملخص العملاء التجاريين"><article class="summary"><span>إجمالي العملاء التجاريين</span><strong id="total-count">0</strong></article><article class="summary"><span>بانتظار الدفع</span><strong id="payment-count">0</strong></article><article class="summary"><span>بانتظار التفعيل</span><strong id="activation-count">0</strong></article><article class="summary"><span>العملاء التجاريون النشطون</span><strong id="active-count">0</strong></article></section>
<section class="toolbar"><button id="open-create" class="primary" type="button">+ إضافة عميل جديد</button><label class="search"><span hidden>بحث</span><input id="search" type="search" placeholder="ابحث باسم الصيدلية أو المالك أو البريد"></label><label><span hidden>تصفية الحالة</span><select id="filter"><option value="ALL">الكل</option><option value="CUSTOMERS">العملاء</option><option value="PAYMENT_PENDING">بانتظار الدفع</option><option value="AWAITING_ACTIVATION">بانتظار التفعيل</option><option value="ACTIVE">النشطون</option><option value="QA">QA / اختبار</option><option value="DEMO">Demo / تجريبي</option><option value="ABANDONED">غير مكتمل / ملغى</option><option value="ARCHIVED">مؤرشف</option></select></label></section><div id="feedback" class="feedback" role="status" aria-live="polite"></div><section id="customers" class="customer-list" aria-live="polite"></section>
<dialog id="create-dialog" aria-labelledby="create-title"><div class="dialog-head"><h2 id="create-title">إضافة عميل جديد</h2><button class="close" type="button" id="close-create" aria-label="إغلاق">×</button></div><form id="customer-form" novalidate><div class="form-grid"><div class="field"><label for="pharmacy">اسم الصيدلية <span class="required">*</span></label><input id="pharmacy" maxlength="100" required></div><div class="field"><label for="owner">اسم المالك الكامل <span class="required">*</span></label><input id="owner" maxlength="100" required></div><div class="field full"><label for="email">البريد الإلكتروني <span class="required">*</span></label><input id="email" type="email" maxlength="320" dir="ltr" required></div><div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" maxlength="20" dir="ltr"></div><div class="field"><label for="city">المدينة</label><input id="city" maxlength="100"></div></div><p class="note">سيُضاف العميل بحالة «بانتظار الدفع». لا تُطلب كلمة مرور من المالك.</p><div class="form-actions"><button id="submit-customer" class="primary" type="submit">حفظ العميل</button><button id="cancel-create" class="action secondary" type="button">إلغاء</button></div></form></dialog>
</main><script>
const state={customers:[],summary:{total:0,payment_pending:0,activation_pending:0,active:0},busy:new Set(),submitting:false};const labels={PAYMENT_PENDING:'بانتظار الدفع',READY_TO_PROVISION:'جاهز لإنشاء الصيدلية',AWAITING_OWNER_ACTIVATION:'بانتظار تفعيل المالك',ACTIVE:'نشط',ACTIVATION_EMAIL_FAILED:'فشل إرسال التفعيل',ABANDONED:'محاولة ملغاة',ARCHIVED:'مؤرشف'};const classifications={COMMERCIAL:'تجاري',QA:'QA / اختبار',DEMO:'Demo / تجريبي'};const tones={PAYMENT_PENDING:'amber',READY_TO_PROVISION:'green',AWAITING_OWNER_ACTIVATION:'amber',ACTIVE:'green',ACTIVATION_EMAIL_FAILED:'red',ABANDONED:'gray',ARCHIVED:'gray'};const dialog=document.getElementById('create-dialog'),form=document.getElementById('customer-form'),search=document.getElementById('search'),filter=document.getElementById('filter'),customers=document.getElementById('customers'),pharmacy=document.getElementById('pharmacy'),owner=document.getElementById('owner'),email=document.getElementById('email'),phone=document.getElementById('phone'),city=document.getElementById('city');
function esc(v){const n=document.createElement('span');n.textContent=String(v??'');return n.innerHTML}function date(v){return v?new Intl.DateTimeFormat('ar',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—'}function feedback(m,t='success'){const b=document.getElementById('feedback');b.textContent=m;b.className=`feedback show ${t}`;b.scrollIntoView({behavior:'smooth',block:'nearest'})}function errorText(d){return {'Owner email is already assigned to another customer':'البريد الإلكتروني مرتبط بعميل آخر','Customer already exists':'العميل موجود مسبقاً','Payment must be confirmed before provisioning':'يجب تأكيد استلام الدفع أولاً','Customer could not be provisioned':'تعذر إنشاء الصيدلية. راجع البيانات وحاول مرة أخرى.','Archived customer cannot be changed':'العميل المؤرشف لا يقبل إجراءات تشغيلية'}[d]||'تعذر تنفيذ العملية. يرجى المحاولة مرة أخرى.'}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-PharmaSUD-Internal':'1',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(errorText(d.detail));return d}function activation(c){if(c.status==='ACTIVE')return'تم تفعيل المالك';if(c.status==='ACTIVATION_EMAIL_FAILED')return'فشل إرسال رابط التفعيل';if(c.activation_email_sent_at)return'تم إرسال رابط التفعيل';return c.pharmacy_id?'لم يُرسل رابط التفعيل':'لم تبدأ مرحلة التفعيل'}
function actions(c){if(['ABANDONED','ARCHIVED'].includes(c.status)||c.classification==='DEMO')return'';const off=state.busy.has(c.id)?'disabled':'';let h='';if(!c.payment_confirmed)h+=`<button class="action small" ${off} data-action="confirm-payment" data-id="${c.id}">تأكيد استلام الدفع</button>`;if(c.status==='READY_TO_PROVISION')h+=`<button class="action small" ${off} data-action="provision" data-id="${c.id}">إنشاء الصيدلية</button>`;if(c.status==='ACTIVATION_EMAIL_FAILED')h+=`<button class="action small secondary" ${off} data-action="resend-activation" data-id="${c.id}">إعادة إرسال رابط التفعيل</button>`;return h+`<button class="action small danger" ${off} data-action="archive" data-id="${c.id}">أرشفة العميل</button>`}function matches(c,f){if(f==='ALL')return true;if(f==='CUSTOMERS')return c.classification==='COMMERCIAL'&&!['ABANDONED','ARCHIVED'].includes(c.status);if(f==='QA'||f==='DEMO')return c.classification===f;if(f==='AWAITING_ACTIVATION')return c.classification==='COMMERCIAL'&&['AWAITING_OWNER_ACTIVATION','ACTIVATION_EMAIL_FAILED'].includes(c.status);if(f==='ACTIVE')return c.classification==='COMMERCIAL'&&c.status==='ACTIVE';return c.status===f}function paymentLabel(c){if(c.origin==='LEGACY_BACKFILL')return'عميل سابق للنظام';if(c.classification!=='COMMERCIAL')return'غير تجاري';return c.payment_confirmed?'تم تأكيد الدفع':'بانتظار الدفع'}
function render(){const q=search.value.trim().toLowerCase(),f=filter.value,s=state.summary;document.getElementById('total-count').textContent=s.total;document.getElementById('payment-count').textContent=s.payment_pending;document.getElementById('activation-count').textContent=s.activation_pending;document.getElementById('active-count').textContent=s.active;const rows=state.customers.filter(c=>matches(c,f)&&(!q||[c.pharmacy_name,c.owner_name,c.owner_email].some(v=>(v||'').toLowerCase().includes(q))));customers.innerHTML=rows.length?rows.map(c=>`<article class="customer ${c.status==='ARCHIVED'?'archived':''}" data-customer-id="${c.id}"><div class="customer-head"><div><h2>${esc(c.pharmacy_name)}</h2><div class="owner-name">${esc(c.owner_name)}</div></div><div class="badges"><span class="badge">${esc(classifications[c.classification]||c.classification)}</span><span class="badge ${tones[c.status]||''}">${esc(labels[c.status]||c.status)}</span><span class="badge">${esc(paymentLabel(c))}</span></div></div><div class="details"><div class="detail"><label>البريد الإلكتروني</label><span class="ltr">${esc(c.owner_email||'—')}</span></div><div class="detail"><label>الهاتف / المدينة</label><span>${esc([c.owner_phone,c.city].filter(Boolean).join(' — ')||'—')}</span></div><div class="detail"><label>حالة التفعيل</label><span>${esc(activation(c))}</span></div><div class="detail"><label>تاريخ الإنشاء</label><span>${date(c.created_at)}</span></div>${c.payment_confirmed_at?`<div class="detail"><label>تأكيد الدفع</label><span>${date(c.payment_confirmed_at)}</span></div>`:''}${c.archived_at?`<div class="detail"><label>تاريخ الأرشفة</label><span>${date(c.archived_at)}</span></div>`:''}</div><div class="actions">${actions(c)}</div></article>`).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}
async function load(){const d=await api('/api/internal/customers');state.customers=d.customers;state.summary=d.summary;render()}async function act(id,a){if(state.busy.has(id))return;if(a==='confirm-payment'&&!confirm('هل تم استلام الدفع وتريد تأكيده؟'))return;if(a==='archive'&&!confirm('هل أنت متأكد من أرشفة هذا العميل؟'))return;state.busy.add(id);render();try{await api(`/api/internal/customers/${id}/${a}`,{method:'POST'});feedback(a==='archive'?'تمت أرشفة العميل مع حفظ سجلاته.':'تم تنفيذ الإجراء بنجاح.');await load()}catch(e){feedback(e.message,'error')}finally{state.busy.delete(id);render()}}customers.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.id,b.dataset.action)});search.addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('open-create').addEventListener('click',()=>{form.reset();dialog.showModal();pharmacy.focus()});function closeDialog(){form.reset();dialog.close()}document.getElementById('close-create').addEventListener('click',closeDialog);document.getElementById('cancel-create').addEventListener('click',closeDialog);
form.addEventListener('submit',async e=>{e.preventDefault();if(state.submitting||!form.reportValidity())return;state.submitting=true;const b=document.getElementById('submit-customer');b.disabled=true;b.textContent='جارٍ الحفظ…';try{const d=await api('/api/internal/customers',{method:'POST',body:JSON.stringify({pharmacy_name:pharmacy.value,owner_name:owner.value,owner_email:email.value,owner_phone:phone.value,city:city.value,payment_confirmed:false})});if(d.idempotent)throw new Error('العميل موجود مسبقاً');closeDialog();feedback('تمت إضافة العميل بحالة «بانتظار الدفع».');await load()}catch(x){feedback(x.message,'error')}finally{state.submitting=false;b.disabled=false;b.textContent='حفظ العميل'}});load().catch(e=>feedback(e.message,'error'));
</script></body></html>
