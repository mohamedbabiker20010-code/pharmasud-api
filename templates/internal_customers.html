<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسليم العملاء — PharmaSUD</title><style>body{font-family:sans-serif;background:#f4f7fa;margin:24px}.panel{background:#fff;padding:20px;border-radius:14px;margin-bottom:20px}input,select,button{padding:10px;margin:5px;border:1px solid #ccd6df;border-radius:7px}button{background:#168bd2;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}</style>
<h1>تسليم عملاء PharmaSUD</h1><p>المشغّل: {{ operator }}</p>
<form id="customer" class="panel"><input id="pharmacy" required placeholder="اسم الصيدلية"><input id="owner" required placeholder="اسم المالك الكامل"><input id="email" type="email" required placeholder="بريد المالك"><input id="phone" placeholder="الهاتف (اختياري)"><input id="city" placeholder="المدينة (اختياري)"><label><input id="paid" type="checkbox"> تم تأكيد الدفع</label><button>إضافة العميل</button><p id="message" role="status"></p></form>
<div class="panel"><table><thead><tr><th>الصيدلية</th><th>المالك</th><th>البريد</th><th>الدفع</th><th>الحالة</th><th>أنشئ في</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-PharmaSUD-Internal':'1',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.detail||'فشل الطلب');return d}
function esc(value){const node=document.createElement('span');node.textContent=String(value??'');return node.innerHTML}
async function load(){const d=await api('/api/internal/customers');document.getElementById('rows').innerHTML=d.customers.map(c=>`<tr><td>${esc(c.pharmacy_name)}</td><td>${esc(c.owner_name)}</td><td dir="ltr">${esc(c.owner_email)}</td><td>${c.payment_confirmed?'نعم':'لا'}</td><td>${esc(c.status)}</td><td dir="ltr">${esc(c.created_at||'')}</td><td>${!c.payment_confirmed?`<button onclick="act('${c.id}','confirm-payment')">تأكيد الدفع</button>`:''}${c.status==='READY_TO_PROVISION'?`<button onclick="act('${c.id}','provision')">إنشاء الصيدلية</button>`:''}${c.status==='ACTIVATION_EMAIL_FAILED'?`<button onclick="act('${c.id}','resend-activation')">إعادة إرسال التفعيل</button>`:''}</td></tr>`).join('')}
function show(value){document.getElementById('message').textContent=value}
async function act(id,action){try{await api(`/api/internal/customers/${id}/${action}`,{method:'POST'});show('تم تنفيذ العملية');await load()}catch(error){show(error.message)}}
document.getElementById('customer').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/internal/customers',{method:'POST',body:JSON.stringify({pharmacy_name:pharmacy.value,owner_name:owner.value,owner_email:email.value,owner_phone:phone.value,city:city.value,payment_confirmed:paid.checked})});e.target.reset();show('تمت إضافة العميل');await load()}catch(error){show(error.message)}});load().catch(error=>show(error.message));
</script></html>
