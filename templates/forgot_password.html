<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نسيت كلمة المرور — PharmaSUD</title><style>body{font-family:sans-serif;background:#f5f8fb;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:16px;width:min(420px,90vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px}button{background:#168bd2;color:white;border:0;border-radius:8px}</style>
<div class="card"><h2>نسيت كلمة المرور؟</h2><p>أدخل بريد الحساب لإرسال رابط آمن.</p><form id="forgot"><input id="email" type="email" autocomplete="email" required placeholder="البريد الإلكتروني"><button>إرسال تعليمات الاستعادة</button></form><p id="message"></p></div>
<script>document.getElementById('forgot').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const d=await r.json();document.getElementById('message').textContent=d.message;});</script></html>
